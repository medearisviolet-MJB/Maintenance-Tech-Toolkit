<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance Tech Toolkit</title>

<link rel="stylesheet" href="CSS/style.css">

 
</head>
<body>

<header>
  <h1>⚙️ Maintenance Tech Toolkit</h1>
  <p>Industrial Maintenance Companion</p>
</header>

<main>
  <div class="grid">
    <button class="card" onclick="show('electrical')">
      <span>⚡</span>Electrical
    </button>
    <button class="card" onclick="show('plc')">
      <span>🧠</span>PLC
    </button>
    <button class="card" onclick="show('vfd')">
      <span>⚙️</span>VFD
    </button>
    <button class="card" onclick="show('maintenance')">
      <span>🔧</span>Maintenance
    </button>
  </div>

  <section class="panel" id="content">
    <h2>Welcome, Technician!</h2>
    <p>Select a tool above to get started.</p>
  </section>
</main>


<script src="js/vfd-faults.js"></script>
<script src="js/vfd-diagnostics.js"></script>
<script src="js/app.js"></script>
<script src="js/calculators.js"></script>
</body>
</html>
